<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/images/favicon-32x32.png">
    <title>Product_Preview</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="wrapper">
                <div class="product_image">
                    <img class="desktops" src="./assets/images/image-product-desktop.jpg" alt="image-product-desktop">
                    <img class="mobiles" src="./assets/images/image-product-mobile.jpg" alt="image-product-mobile">
                </div>
                <div class="product_details">
                    <h4 class="product">PERFUME</h4>
                    <div>
                        <h2>Gabrielle<br class="desktop"> Essence<br class="mobile"> Eau<br class="desktop"> De Parfum</h2>
                    </div>
                    <div>
                        <p class="product-description">
                             A floral, solar and voluptuous interpretation composed by <br class="desktop">Olivier Polge, Perfumer-Creator<br class="desktop"> for the House of CHANEL.
                        </p>
                    </div>
                    <div class="price-tag">
                        <span class="price"> $149.99 </span>
                        <span class="line-throught">$169.99</span>
                    </div>
                    <div>
                        <button type="submit">
                            <img src="/assets/images/icon-cart.svg" alt="cart icon">
                            <span>Add to Cart</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
